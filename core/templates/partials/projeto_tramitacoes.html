{% for tramitacao in tramitacoes %}
  <p>{{ tramitacao.dataHora }} - {{ tramitacao.descricaoSituacao }}</p>
{% endfor %}

<button
  class="mt-3 rounded-md border border-white/15 px-3 py-1.5 text-sm font-semibold text-white transition hover:bg-white/10 disabled:opacity-50"
  id="load-more-tram"
  hx-swap-oob="outerHTML"
  {% if tramitacoes %}
    hx-get="{% url 'projeto_tramitacoes' projeto_id %}?page={{ next_page }}"
    hx-target="#proj-tram-content"
    hx-swap="beforeend"
  {% else %}
    disabled
  {% endif %}
>
  Carregar mais
</button>
