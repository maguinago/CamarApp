{% for votacao in votacoes %}
  <p><strong class="text-slate-100">{{ votacao.id }}</strong> - {{ votacao.descricao }}</p>
{% endfor %}

<button
  class="mt-3 rounded-md border border-white/15 px-3 py-1.5 text-sm font-semibold text-white transition hover:bg-white/10 disabled:opacity-50"
  id="load-more-votes"
  hx-swap-oob="outerHTML"
  {% if votacoes %}
    hx-get="{% url 'comissao_votacoes' comissao_id %}?page={{ next_page }}"
    hx-target="#votes-content"
    hx-swap="beforeend"
  {% else %}
    disabled
  {% endif %}
>
  Carregar mais
</button>
