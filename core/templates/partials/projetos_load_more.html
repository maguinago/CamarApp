<button
  id="load-more-projetos"
  class="rounded-md border border-white/15 px-4 py-2 text-sm font-semibold text-white transition hover:bg-white/10 disabled:opacity-50"
  {% if oob %}hx-swap-oob="outerHTML"{% endif %}
  {% if has_more %}
    hx-get="{% url 'projetos' %}?page={{ next_page }}&ano={{ ano }}&siglaTipo={{ sigla_tipo }}"
    hx-target="#projetos-list"
    hx-swap="beforeend"
  {% else %}
    disabled
  {% endif %}
>
  Carregar mais
</button>
